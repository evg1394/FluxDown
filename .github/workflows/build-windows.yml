name: Build Windows Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.5.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'Trigger v0.5.4 build')
    name: Build Windows x64
    runs-on: windows-latest

    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } elseif ("${{ github.ref }}" -eq "refs/heads/main") {
            $tag = "v0.5.4"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            throw "Invalid version tag: $tag"
          }

          $version = $tag.Substring(1)

          "TAG=$tag" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Tag: $tag"
          Write-Host "Version: $version"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }} == 'refs/heads/main' && github.sha || ${{ steps.version.outputs.TAG }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-windows-x64
          cache-on-failure: true

      - name: Build FluxDown
        shell: bash
        env:
          FLUXDOWN_APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cargo build --locked --release \
            --target x86_64-pc-windows-msvc \
            -p fluxdown_ui_app \
            -p fluxdown_agent \
            -p fluxdown_daemon \
            -p fluxdown_nmh \
            --features fluxdown_agent/desktop \
            --bins

      - name: Prepare application
        shell: pwsh
        run: |
          $stage = "build\gpui\windows-x64"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($bin in `
            "fluxdown-desktop",
            "fluxdown-agent",
            "fluxdownd",
            "fluxdown_nmh") {

            $source = "target\x86_64-pc-windows-msvc\release\$bin.exe"

            if (-not (Test-Path $source)) {
              throw "Binary not found: $source"
            }

            Copy-Item $source $stage
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath

          if (-not $vsRoot) {
            throw "Visual Studio installation not found"
          }

          $crtDir = Get-ChildItem `
            "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC1*.CRT" `
            -Directory |
            Sort-Object FullName |
            Select-Object -Last 1

          if (-not $crtDir) {
            throw "MSVC CRT not found"
          }

          Copy-Item `
            "$($crtDir.FullName)\msvcp140*.dll",
            "$($crtDir.FullName)\vcruntime140*.dll" `
            $stage -Force

          Get-ChildItem $stage

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install Inno Setup language
        shell: pwsh
        run: |
          Copy-Item `
            "installer\windows\ChineseSimplified.isl" `
            "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" `
            -Force

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null

          iscc `
            /DMyAppVersion=$env:VERSION `
            /DMyAppArch=x64 `
            "/DMySourceDir=$PWD\build\gpui\windows-x64" `
            installer\windows\setup.iss

          $generated = Get-ChildItem "build\installer\FluxDown-*.exe" | Select-Object -First 1

          if (-not $generated) {
            throw "Inno Setup did not produce an installer"
          }

          $installerName = "FluxDown-$env:VERSION-RU-windows-x64-setup.exe"

          Rename-Item `
            -LiteralPath $generated.FullName `
            -NewName $installerName `
            -Force

          $installer = Join-Path "build\installer" $installerName

          Write-Host "Installer created:"
          Get-Item $installer

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxDown-Windows-x64-${{ steps.version.outputs.VERSION }}-RU
          path: build/installer/FluxDown-*-RU-windows-x64-setup.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: ${{ steps.version.outputs.TAG }}
        shell: pwsh
        run: |
          $installer = "build\installer\FluxDown-$env:VERSION-RU-windows-x64-setup.exe"
          $repo = "${{ github.repository }}"

          gh release view $env:TAG --repo $repo 2>$null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists. Uploading installer..."

            gh release upload `
              $env:TAG `
              $installer `
              --repo $repo `
              --clobber

            gh release edit `
              $env:TAG `
              --repo $repo `
              --title "FluxDown $env:VERSION RU" `
              --latest
          }
          else {
            Write-Host "Release $env:TAG does not exist. Creating..."

            gh release create `
              $env:TAG `
              $installer `
              --repo $repo `
              --title "FluxDown $env:VERSION RU" `
              --generate-notes `
              --latest
          }
