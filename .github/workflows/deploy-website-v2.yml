name: Deploy Website v2

# 仅当 main 分支（开发分支）上 website-v2/ 目录有变更时触发，
# 通过 SSH 登录服务器执行 website-v2/deploy.sh 重建并重启容器
# （官网：https://fluxdown.com/ → 127.0.0.1:4322）。
on:
  push:
    branches: [main]
    paths:
      - "website-v2/**"
      - ".github/workflows/deploy-website-v2.yml"
  workflow_dispatch: {} # 允许在 Actions 页面手动触发

# 部署在服务器的仓库检出上执行 fetch + reset，同组排队串行，不可并发
concurrency:
  group: deploy-website
  cancel-in-progress: false # 部署不可中途取消，排队执行

jobs:
  deploy:
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # DEPLOY_PATH 沿用旧站时期的取值：服务器仓库检出中的 website/（旧站已删除，该目录可能已不存在）。
          # dirname 是纯字符串运算，不要求 website/ 存在；不能写 DEPLOY_PATH/../website-v2，
          # bash 的 cd 要求 .. 之前的路径真实存在。
          script: |
            cd $(dirname ${{ secrets.DEPLOY_PATH }})/website-v2
            bash deploy.sh
