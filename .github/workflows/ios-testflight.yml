# 原生 iOS App（mobile/FluxDown，Bundle ID com.fluxdown.app）→ TestFlight。
# 流程与本机一致，全部在 mobile/FluxDown/scripts/testflight.sh：
#   build-core.sh --release → xcodebuild archive（不签名）→ exportArchive（Apple Distribution + App Store 描述文件）
#   → altool 上传 → asc.py 等待处理完成、写「测试内容」、加入测试组（含外部组时提交 Beta 审核）。
# 触发：
#   - 推送 v* tag：版本号取 tag（vX.Y.Z-rc.N → X.Y.Z）。内部组「Internal」已开自动分发，
#     额外的组取仓库变量 IOS_TESTFLIGHT_GROUPS（逗号分隔，留空 = 只发内部组）。
#   - 手动：gh workflow run ios-testflight.yml --ref main -f version=X.Y.Z [-f upload=false] [-f groups="Public Beta"]
#     upload=false 只做 altool --validate-app 演练，不消耗构建号、不出现在 TestFlight。
#   - 被 test-package.yml（target=ios / all）以 workflow_call 复用，可指定构建 ref。
# 构建号 = UTC 时间 YYYYMMDD.HHMMSS：跨 workflow / 重跑都唯一且递增（run_number 各 workflow 独立计数会撞号）。
# Secrets：IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD / IOS_APPSTORE_PROFILE_BASE64
#          APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_P8_BASE64（与 macOS 公证共用）/ FLUXCLOUD_BASE_URL
# 证书与描述文件 2027-09-12 到期，续期步骤见 .omp/knowledge/ops.md「iOS TestFlight」。
name: iOS TestFlight
run-name: >-
  ${{ inputs.version != ''
  && format('iOS TestFlight {0}{1}', inputs.version, inputs.upload && '' || '（仅校验）')
  || format('iOS TestFlight {0}', github.ref_name) }}
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "CFBundleShortVersionString（X.Y.Z）"
        required: true
        type: string
      upload:
        description: "上传到 TestFlight；关闭则只做 altool 校验"
        required: false
        default: true
        type: boolean
      groups:
        description: "额外加入的 TestFlight 组（逗号分隔；留空 = 仓库变量 IOS_TESTFLIGHT_GROUPS；内部组 Internal 自动分发）"
        required: false
        default: ""
        type: string
      whats_new:
        description: "TestFlight「测试内容」（留空 = FluxDown <version>）"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        description: "构建的 git ref（留空 = 调用方的提交）"
        required: false
        default: ""
        type: string
      version:
        required: true
        type: string
      upload:
        required: false
        default: true
        type: boolean
      groups:
        required: false
        default: ""
        type: string
      whats_new:
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    # 工程是 Xcode 27 格式（objectVersion 110）且用了 iOS 27 SDK API；macos-26 镜像只到 Xcode 26.x。
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve version and build number
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          INPUT_GROUPS: ${{ inputs.groups }}
          INPUT_WHATS_NEW: ${{ inputs.whats_new }}
          VAR_GROUPS: ${{ vars.IOS_TESTFLIGHT_GROUPS }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            UPLOAD="$INPUT_UPLOAD"
            GROUPS_CSV="${INPUT_GROUPS:-$VAR_GROUPS}"
            WHATS_NEW="$INPUT_WHATS_NEW"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%-*}"
            UPLOAD=true
            GROUPS_CSV="$VAR_GROUPS"
            WHATS_NEW="FluxDown ${GITHUB_REF_NAME}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号须为 X.Y.Z（得到 '$VERSION'）"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "build=$(date -u +%Y%m%d.%H%M%S)"
            echo "upload=$UPLOAD"
            echo "groups=$GROUPS_CSV"
            echo "whats_new=${WHATS_NEW:-FluxDown $VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-testflight
          cache-on-failure: true

      - name: Decode signing credentials
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$IOS_DIST_CERT_P12_BASE64" ] || [ -z "$IOS_APPSTORE_PROFILE_BASE64" ] || [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 / IOS_APPSTORE_PROFILE_BASE64 / APPLE_API_KEY_P8_BASE64 未配置"
            exit 1
          fi
          umask 077
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive, sign and upload
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          FLUXCLOUD_BASE_URL_SECRET: ${{ secrets.FLUXCLOUD_BASE_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          UPLOAD: ${{ steps.meta.outputs.upload }}
          GROUPS_CSV: ${{ steps.meta.outputs.groups }}
          WHATS_NEW: ${{ steps.meta.outputs.whats_new }}
        run: |
          if [ -n "$FLUXCLOUD_BASE_URL_SECRET" ]; then export FLUXCLOUD_BASE_URL="$FLUXCLOUD_BASE_URL_SECRET"; fi
          ARGS=(--version "$VERSION" --build "$BUILD"
                --p12 "$RUNNER_TEMP/dist.p12" --profile "$RUNNER_TEMP/appstore.mobileprovision")
          if [ "$UPLOAD" = "true" ]; then
            ARGS+=(--upload --whats-new "$WHATS_NEW")
            IFS=',' read -ra GROUP_LIST <<< "$GROUPS_CSV"
            for group in ${GROUP_LIST[@]+"${GROUP_LIST[@]}"}; do
              group="$(echo "$group" | xargs)"
              if [ -n "$group" ]; then ARGS+=(--group "$group"); fi
            done
          fi
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" mobile/FluxDown/scripts/testflight.sh "${ARGS[@]}"
          echo "### iOS ${VERSION} (${BUILD}) — $([ "$UPLOAD" = true ] && echo '已上传 TestFlight' || echo '仅校验')" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload IPA and dSYMs
        if: steps.meta.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.build }}
          path: |
            mobile/FluxDown/build/testflight/FluxDown.ipa
            mobile/FluxDown/build/testflight/FluxDown.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 30
